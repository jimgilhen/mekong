<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How Product Specs and Verification Work With a Co-Packer | Mekong Quality Assurance Advisory</title>
<meta name="description" content="How the product spec, packaging specification, and verification protocol fit together for food and beverage brands using co-packers in Southeast Asia, and who owns each part.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--sf:#fff;--tx:#1d2420;--mu:#5c6660;--ln:#e2ddd3;--co:#b4452e;--cob:#fbece8;--te:#0f6b57;--teb:#e4f2ee;--gr:#efece6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a18;--sf:#1e2522;--tx:#ecefea;--mu:#a3aca6;--ln:#2f3833;--co:#f08a73;--cob:#3a211c;--te:#5cc4a8;--teb:#16302a;--gr:#222a26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a18;--sf:#1e2522;--tx:#ecefea;--mu:#a3aca6;--ln:#2f3833;--co:#f08a73;--cob:#3a211c;--te:#5cc4a8;--teb:#16302a;--gr:#222a26;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Lato,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
h1,h2,h3{font-family:"EB Garamond",Georgia,serif;font-weight:500;line-height:1.2;margin:0}
p{margin:0 0 12px}
a{color:var(--te)}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--sf);border-bottom:1px solid var(--ln);box-shadow:0 4px 18px -10px rgba(0,0,0,.3)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0;position:relative}
.brand{font:600 22px/1.15 "EB Garamond",Georgia,serif;color:var(--tx);text-decoration:none}
.r{display:flex;gap:14px;align-items:center}
.r nav{display:flex;gap:16px;align-items:center}
.r nav a{color:var(--mu);text-decoration:none;font-size:14px}
.r nav a[aria-current]{color:var(--te);font-weight:700}
.btn{display:inline-block;background:var(--tx);color:var(--bg)!important;padding:9px 18px;border-radius:6px;font-weight:700;font-size:14px;text-decoration:none}
.menu{display:none;background:none;border:1px solid var(--ln);border-radius:6px;padding:7px 11px;color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
@media(max-width:700px){.menu{display:block}.brand{font-size:17px;max-width:170px}.r nav{display:none;position:absolute;left:-20px;right:-20px;top:100%;background:var(--sf);border-bottom:1px solid var(--ln);flex-direction:column;align-items:flex-start;padding:14px 20px;gap:14px}.r nav.open{display:flex}}
.jump{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px}
.jump a{white-space:nowrap;font-size:13px;padding:4px 12px;border:1px solid var(--ln);border-radius:6px;color:var(--mu);text-decoration:none}
section{padding:48px 0;border-top:1px solid var(--ln)}
.kick{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
h1{font-size:clamp(28px,5.4vw,42px)}
h2{font-size:clamp(24px,4.5vw,32px);margin-bottom:12px}
h2::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--te);margin-top:10px}
h3{font-size:20px;margin-bottom:6px}
.lede{font-size:18px;color:var(--mu);max-width:700px;margin:14px 0 22px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px -16px rgba(0,0,0,.28)}
.card p{font-size:14px;color:var(--mu);margin:0 0 8px}
.card .tag{color:var(--te);font-weight:700;font-size:13px;margin:8px 0 0}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:10px;background:var(--sf);margin:14px 0}
table{border-collapse:collapse;font-size:13px;width:100%}
.big{min-width:1000px}
