<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mekong Quality Assurance Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--sf:#fff;--tx:#1d2420;--mu:#5c6660;--ln:#e2ddd3;--co:#b4452e;--cob:#fbece8;--te:#0f6b57;--teb:#e4f2ee;--gr:#efece6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a18;--sf:#1e2522;--tx:#ecefea;--mu:#a3aca6;--ln:#2f3833;--co:#f08a73;--cob:#3a211c;--te:#5cc4a8;--teb:#16302a;--gr:#222a26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a18;--sf:#1e2522;--tx:#ecefea;--mu:#a3aca6;--ln:#2f3833;--co:#f08a73;--cob:#3a211c;--te:#5cc4a8;--teb:#16302a;--gr:#222a26;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Lato,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
h1,h2,h3{font-family:"EB Garamond",Georgia,serif;font-weight:500;line-height:1.2;margin:0}
p{margin:0 0 12px}
.w{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--sf);border-bottom:1px solid var(--ln)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.brand{font:600 22px "EB Garamond",Georgia,serif}
.top nav{display:flex;gap:16px;align-items:center}
.top a{color:var(--mu);text-decoration:none;font-size:14px}
.btn{display:inline-block;background:var(--tx);color:var(--bg)!important;padding:9px 18px;border-radius:6px;font-weight:700;font-size:14px;text-decoration:none}
.jump{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px}
.jump a{white-space:nowrap;font-size:13px;padding:4px 12px;border:1px solid var(--ln);border-radius:6px;color:var(--mu);text-decoration:none}
.jump a.on{background:var(--teb);color:var(--te);border-color:var(--te)}
section{padding:56px 0;border-top:1px solid var(--ln)}
section:first-of-type{border-top:0}
.kick{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
h1{font-size:clamp(27px,5.4vw,43px)}
h2{font-size:clamp(25px,4.5vw,34px);margin-bottom:12px}
.lede{font-size:18px;color:var(--mu);max-width:640px;margin:14px 0 28px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:18px}
.card h3{font-size:20px;margin-bottom:6px}
.card p{font-size:14px;color:var(--mu);margin:0}
a.entry{text-decoration:none;color:inherit;display:block;border-color:var(--co)}
a.entry b{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--cob);color:var(--co);align-items:center;justify-content:center;font-size:13px;margin-bottom:8px}
.arrow{text-align:center;color:var(--mu);font-size:14px;margin:22px 0 0}
.flash{background:var(--cob);border:1px solid var(--co);border-radius:12px;padding:24px;text-align:center;max-width:620px;margin:0 auto 26px}
.flash h2{color:var(--co);margin-bottom:8px}.flash p{margin:0;color:var(--co)}
.dead{background:var(--gr)}.dead h3::before{content:"\2715  ";font-size:14px;color:var(--mu)}
.sol{background:var(--teb);border:1px solid var(--te);border-radius:12px;padding:26px}
.sol h2{color:var(--te)}
.two{display:grid;gap:28px;grid-template-columns:1fr}
